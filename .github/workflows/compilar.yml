name: Compilar Domino6 Offline BT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Extraer y localizar proyecto
        run: |
          echo "Archivos del repositorio:"
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP"
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"

          rm -rf project
          mkdir project

          unzip -q "$ZIP" -d project

          echo "Contenido extraído:"
          find project -maxdepth 4 -type f | sort

          SETTINGS=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle después de extraer el ZIP"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Proyecto Android encontrado en: $PROJECT_ROOT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Domino6-Offline-BT-debug
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk