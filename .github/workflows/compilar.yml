name: Compilar Domino6 Offline BT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar proyecto
        run: |
          unzip -o Domino6_Offline_BT_Nuevo.zip -d project
          echo "Contenido extraído:"
          find project -maxdepth 4 -type f | sort

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar proyecto Android
  run: |
    ROOT=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -1)
    echo "Proyecto encontrado en: $ROOT"
    echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Compilar APK
  working-directory: ${{ env.PROJECT_ROOT }}
  run: gradle assembleDebug --stacktrace

      - name: Guardar APK
  uses: actions/upload-artifact@v4
  with:
    name: Domino6-Offline-BT-debug 
    path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk

      